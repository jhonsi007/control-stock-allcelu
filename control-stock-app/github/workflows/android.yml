name: Crear APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm install

      - name: Copiar jsPDF
        run: npm run prepare-www

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Poner los iconos
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          cp -r resources/icons/mipmap-* android/app/src/main/res/

      - name: Sincronizar
        run: npx cap sync android

      - name: Compilar el APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Guardar el APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk control-stock.apk

      - uses: actions/upload-artifact@v4
        with:
          name: control-stock-apk
          path: control-stock.apk

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ github.run_number }}" control-stock.apk \
            --title "Control de Stock v${{ github.run_number }}" \
            --notes "Descarga control-stock.apk e instalalo en tu Android."
